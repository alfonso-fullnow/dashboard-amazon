<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard | Fullnow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .report-card { background: #1e293b; transition: all 0.3s ease; border: 1px solid #334155; }
        .report-card:hover { transform: translateY(-5px); border-color: #3b82f6; background: #263349; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                Archivo de Reportes Semanales
            </h1>
            <p class="text-gray-400 text-lg">Detección automática de reportes en GitHub</p>
        </header>

        <div id="loading" class="flex justify-center my-10">
            <div class="loader w-12 h-12 border-4 border-gray-700 rounded-full"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="report-grid"></div>

        <footer class="mt-20 pt-8 border-t border-gray-800 text-center text-gray-500 text-sm">
            <p>© 2026 Management Dashboard | Actualizado vía GitHub API</p>
        </footer>
    </div>

    <script>
        // CONFIGURACIÓN: Cambia esto con tus datos de GitHub
        const USER = 'alfonso-fullnow';
        const REPO = 'dashboard-amazon';

        async function loadReports() {
            try {
                // Consultamos la lista de archivos del repositorio
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
                const files = await response.json();

                // Filtramos solo los archivos que empiezan con "Dashboard" y terminan en ".html"
                const reports = files.filter(file => 
                    file.name.startsWith('Dashboard') && 
                    file.name.endsWith('.html')
                );

                // Ordenamos de forma descendente (el más nuevo primero)
                // Esto funciona bien si mantienes el formato "Dashboard [Fecha]"
                reports.sort((a, b) => b.name.localeCompare(a.name));

                const grid = document.getElementById('report-grid');
                const loader = document.getElementById('loading');
                
                loader.style.display = 'none';

                if (reports.length === 0) {
                    grid.innerHTML = '<p class="text-center col-span-2 text-gray-500">No se encontraron archivos "Dashboard..."</p>';
                    return;
                }

                reports.forEach(file => {
                    // Limpiamos el nombre para mostrarlo bonito
                    const displayName = file.name.replace('.html', '').replace('Dashboard ', '');
                    
                    const card = `
                        <a href="${file.path}" class="report-card p-6 rounded-xl flex items-center justify-between group">
                            <div>
                                <h3 class="text-xl font-bold group-hover:text-blue-400 transition-colors">Periodo:</h3>
                                <p class="text-gray-400">${displayName}</p>
                            </div>
                            <div class="text-gray-500 group-hover:text-blue-400">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += card;
                });

            } catch (error) {
                console.error("Error cargando reportes:", error);
                document.getElementById('loading').innerHTML = '<p class="text-red-400">Error al conectar con GitHub</p>';
            }
        }

        loadReports();
    </script>
</body>
</html>
