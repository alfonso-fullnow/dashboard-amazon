<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard | Fullnow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .report-card { background: #1e293b; transition: all 0.3s ease; border: 1px solid #334155; }
        .report-card:hover { transform: translateY(-5px); border-color: #3b82f6; background: #263349; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                Archivo de Reportes Semanales
            </h1>
            <p class="text-gray-400 text-lg">Detección automática de reportes en GitHub</p>
        </header>

        <div id="loading" class="flex justify-center my-10">
            <div class="loader w-12 h-12 border-4 border-gray-700 rounded-full"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="report-grid"></div>

        <footer class="mt-20 pt-8 border-t border-gray-800 text-center text-gray-500 text-sm">
            <p>© 2026 Management Dashboard | Actualizado vía GitHub API</p>
        </footer>
    </div>

    <script>
        // CONFIGURACIÓN: Cambia esto con tus datos de GitHub
        const USER = 'alfonso-fullnow';
        const REPO = 'dashboard-amazon';
    
        // Función para obtener el número de semana del año
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return weekNo;
        }
    
        // Mapeo de meses en español a números para la fecha
        const monthMap = { 'Ene': 0, 'Feb': 1, 'Mar': 2, 'Abr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Ago': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dic': 11 };
    
        async function loadReports() {
            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
                const files = await response.json();
    
                // Filtrar archivos "Dashboard DD-DDMes.html"
                const reports = files.filter(file => file.name.startsWith('Dashboard') && file.name.endsWith('.html'));
    
                // Ordenar: el más reciente primero
                reports.sort((a, b) => b.name.localeCompare(a.name));
    
                const grid = document.getElementById('report-grid');
                document.getElementById('loading').style.display = 'none';
    
                reports.forEach(file => {
                    // Lógica para extraer datos del nombre: "Dashboard 5-11Ene.html"
                    // 1. Quitar el prefijo y sufijo
                    let cleanName = file.name.replace('Dashboard ', '').replace('.html', '');
                    
                    // 2. Extraer el día final y el mes (ej: de "5-11Ene" saca "11" y "Ene")
                    let match = cleanName.match(/(\d+)-(\d+)([a-zA-Z]+)/);
                    
                    let weekLabel = "Semana ??";
                    let yearLabel = "2026"; // Año por defecto según contexto actual
    
                    if (match) {
                        let day = parseInt(match[2]);
                        let monthStr = match[3];
                        let monthIndex = monthMap[monthStr] || 0;
                        
                        // Crear objeto fecha para calcular la semana
                        let reportDate = new Date(2026, monthIndex, day);
                        weekLabel = "Semana " + getWeekNumber(reportDate);
                        yearLabel = reportDate.getFullYear();
                    }
    
                    const card = `
                        <a href="${file.path}" class="report-card p-6 rounded-xl flex items-center justify-between group">
                            <div>
                                <h3 class="text-2xl font-bold group-hover:text-blue-400 transition-colors">${weekLabel}</h3>
                                <p class="text-gray-400 font-medium tracking-widest uppercase text-sm">${yearLabel}</p>
                                <span class="text-[10px] text-gray-600 mt-2 block italic">${file.name}</span>
                            </div>
                            <div class="text-gray-500 group-hover:text-blue-400">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += card;
                });
    
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerHTML = '<p class="text-red-400">Error al cargar reportes</p>';
            }
        }
    
        loadReports();
    </script>
</body>
</html>
