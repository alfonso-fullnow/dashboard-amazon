<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Reportes Semanales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; }
        
        /* Estilo de tarjeta (Nuevo diseño) */
        .report-card { 
            background-color: #1e293b; /* Slate 800 */
            border: 1px solid #334155; /* Slate 700 */
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.2s ease-in-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            height: 100%;
        }

        .report-card:hover { 
            border-color: #3b82f6; /* Blue 500 */
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card-title { font-size: 1.5rem; font-weight: 700; color: white; line-height: 1.2; }
        .card-subtitle { color: #94a3b8; font-size: 0.90rem; margin-top: 0.25rem; margin-bottom: 1rem; }

        /* Badges */
        .badge {
            font-size: 0.70rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin-right: 0.5rem;
            white-space: nowrap;
        }
        
        .badge-red, .badge[class*="bg-red"] { 
            background-color: #451a1a !important; color: #fca5a5 !important; border: 1px solid #7f1d1d !important;
        }
        .badge-green, .badge[class*="bg-green"] { 
            background-color: #143525 !important; color: #86efac !important; border: 1px solid #14532d !important;
        }
        .badge-yellow, .badge[class*="bg-yellow"] { 
            background-color: #422006 !important; color: #fde047 !important; border: 1px solid #713f12 !important;
        }
        .badge-blue, .badge[class*="bg-blue"] { 
            background-color: #172554 !important; color: #93c5fd !important; border: 1px solid #1e3a8a !important;
        }

        .arrow-icon { color: #64748b; width: 24px; height: 24px; transition: color 0.2s; min-width: 24px; }
        .report-card:hover .arrow-icon { color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen text-slate-200 p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <!-- Encabezado Centrado con Título Degradado -->
        <header class="text-center mb-16">
            <h1 class="text-4xl font-bold mb-4 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                Archivo de Reportes Semanales
            </h1>
            <p class="text-slate-400 text-lg">Selecciona un periodo para visualizar el rendimiento global y análisis de competencia.</p>
        </header>

        <!-- Grid: 3 columnas en pantallas grandes (lg) -->
        <div id="report-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loading" class="col-span-full flex justify-center items-center gap-3 text-slate-500 py-10">
                <svg class="animate-spin h-5 w-5 text-teal-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Cargando reportes...</span>
            </div>
        </div>

        <footer class="mt-24 pt-8 border-t border-slate-800 text-center text-slate-500 text-sm">
            <p>© 2026 Management Dashboard | Datos extraídos de la 'KPI sheet'</p>
        </footer>
    </div>

    <script>
        const USER = 'alfonso-fullnow';
        const REPO = 'dashboard-amazon';
        const monthMap = { 'Ene': 0, 'Feb': 1, 'Mar': 2, 'Abr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Ago': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dic': 11 };

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function parseDateFromFilename(filename) {
            const match = filename.match(/(\d+)(?:[a-zA-Z]+)?-(\d+)([a-zA-Z]+)/);
            if (match) {
                const dayStart = parseInt(match[1]);
                const dayEnd = parseInt(match[2]);
                const monthStr = match[3];
                const monthIndex = monthMap[monthStr];
                
                const year = (monthStr === 'Dic') ? 2025 : 2026;
                let dateDisplay = "";
                
                if (dayStart > dayEnd) { 
                     if (monthStr === 'Ene') dateDisplay = `29 de Dic - ${dayEnd} de ${monthStr}, 2026`;
                     else dateDisplay = `${dayStart} - ${dayEnd} de ${monthStr}, ${year}`;
                } else {
                    dateDisplay = `${dayStart} de ${monthStr} - ${dayEnd} de ${monthStr}, ${year}`;
                }

                return {
                    dateObj: new Date(year, monthIndex, dayEnd),
                    display: dateDisplay
                };
            }
            return { dateObj: new Date(0), display: filename };
        }

        async function loadReports() {
            const grid = document.getElementById('report-grid');
            const loader = document.getElementById('loading');

            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
                if (!response.ok) throw new Error('Conexión GitHub fallida');
                
                const data = await response.json();
                let reportFiles = data.filter(f => f.name.startsWith('Dashboard') && f.name.endsWith('.html'));

                const reportsWithContent = await Promise.all(reportFiles.map(async (file) => {
                    const parsedInfo = parseDateFromFilename(file.name);
                    let badgesHtml = '';
                    let weekLabel = 'Reporte';
                    
                    try {
                        const res = await fetch(file.download_url);
                        const text = await res.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');
                        
                        const badgeContainer = Array.from(doc.querySelectorAll('.flex.gap-2')).find(el => el.querySelector('.badge') !== null);
                        if (badgeContainer) badgesHtml = badgeContainer.innerHTML;

                        if (file.name.includes("29Dic")) weekLabel = "Semana 1";
                        else weekLabel = "Semana " + getWeekNumber(parsedInfo.dateObj);

                    } catch (e) { console.error(e); }

                    return {
                        url: file.name,
                        date: parsedInfo.dateObj,
                        dateDisplay: parsedInfo.display,
                        week: weekLabel,
                        badges: badgesHtml
                    };
                }));

                reportsWithContent.sort((a, b) => b.date - a.date);

                loader.remove();
                
                reportsWithContent.forEach(report => {
                    const card = `
                        <a href="${report.url}" class="report-card group">
                            <div class="flex-1 pr-4">
                                <h3 class="card-title">${report.week}</h3>
                                <p class="card-subtitle">${report.dateDisplay}</p>
                                <div class="flex flex-wrap gap-2">
                                    ${report.badges || '<span class="text-xs text-slate-600">Sin etiquetas</span>'}
                                </div>
                            </div>
                            <div>
                                <svg class="arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += card;
                });

            } catch (error) {
                loader.innerHTML = `<p class="text-red-400 col-span-full text-center">Error: ${error.message}</p>`;
            }
        }

        loadReports();
    </script>
</body>
</html>
