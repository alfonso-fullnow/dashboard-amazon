<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Reportes Semanales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; }
        .report-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .report-card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
        }
        .report-card:hover { 
            transform: translateY(-3px); 
            border-color: #3b82f6; 
            background: #263349; 
        }
        .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            margin-right: 0.5rem;
            display: inline-block;
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 p-6 md:p-12">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-16">
            <h1 class="text-4xl font-bold text-teal-400 mb-4">Archivo de Reportes Semanales</h1>
            <p class="text-slate-400">Detección automática de reportes en GitHub</p>
        </header>

        <div id="report-grid" class="report-grid">
            <div id="loading" class="col-span-full text-center py-10 text-slate-500">
                Buscando reportes en el repositorio...
            </div>
        </div>

        <footer class="mt-24 pt-8 border-t border-slate-800 text-center text-slate-500 text-xs text-opacity-50">
            <p>© 2026 Management Dashboard | Actualizado vía GitHub API</p>
        </footer>
    </div>

    <script>
        const USER = 'alfonso-fullnow';
        const REPO = 'dashboard-amazon';

        const monthMap = { 'Ene': 0, 'Feb': 1, 'Mar': 2, 'Abr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Ago': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dic': 11 };

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        async function loadReports() {
            const grid = document.getElementById('report-grid');
            const loader = document.getElementById('loading');

            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
                if (!response.ok) throw new Error('Error de conexión');
                
                const files = await response.json();
                const reports = files.filter(f => f.name.startsWith('Dashboard') && f.name.endsWith('.html'));
                
                // Ordenar: lo más nuevo primero
                reports.sort((a, b) => b.name.localeCompare(a.name));

                loader.remove();

                reports.forEach(file => {
                    let cleanName = file.name.replace('Dashboard ', '').replace('.html', '');
                    
                    // Lógica para detectar el formato de fecha y calcular semana
                    let match = cleanName.match(/(\d+)-(\d+)([a-zA-Z]+)/);
                    let weekLabel = "Reporte";
                    let dateRange = cleanName;

                    if (match) {
                        let dayStart = match[1].padStart(2, '0');
                        let dayEnd = match[2].padStart(2, '0');
                        let monthStr = match[3];
                        let year = 2026;
                        
                        // Si es el reporte de fin de año (29Dic-4Ene)
                        if (cleanName.includes("29Dic")) {
                            weekLabel = "Semana 1";
                            dateRange = "29 de Dic - 04 de Ene, 2026";
                        } else {
                            let endDate = new Date(year, monthMap[monthStr], parseInt(dayEnd));
                            weekLabel = "Semana " + getWeekNumber(endDate);
                            dateRange = `${dayStart} de ${monthStr} - ${dayEnd} de ${monthStr}, ${year}`;
                        }
                    }

                    // Etiquetas (Badges) específicas según el reporte
                    let badges = "";
                    if (file.name.includes("5-11Ene")) {
                        badges = `
                            <span class="badge bg-red-900/30 text-red-400 border border-red-800/50">Refund Alert US</span>
                            <span class="badge bg-green-900/30 text-green-400 border border-green-800/50">IT/FR Success</span>
                        `;
                    } else if (file.name.includes("29Dic-4Ene")) {
                        badges = `
                            <span class="badge bg-yellow-900/30 text-yellow-400 border border-yellow-800/50">PPC Ranking Push</span>
                            <span class="badge bg-blue-900/30 text-blue-400 border border-blue-800/50">Year Transition</span>
                        `;
                    }

                    const card = `
                        <a href="${file.name}" class="report-card group">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-2xl font-bold text-white group-hover:text-teal-400 transition-colors mb-1">${weekLabel}</h3>
                                    <p class="text-slate-400 text-sm mb-4">${dateRange}</p>
                                    <div class="flex gap-1">${badges}</div>
                                </div>
                                <div class="text-slate-600 group-hover:text-slate-300 mt-2">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                    </svg>
                                </div>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += card;
                });

            } catch (error) {
                loader.innerHTML = `<span class="text-red-400 italic text-sm">Error cargando archivos: ${error.message}</span>`;
            }
        }

        loadReports();
    </script>
</body>
</html>
