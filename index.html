<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard | Fullnow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .report-card { background: #1e293b; transition: all 0.3s ease; border: 1px solid #334155; }
        .report-card:hover { transform: translateY(-5px); border-color: #3b82f6; background: #263349; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                Archivo de Reportes Semanales
            </h1>
            <p class="text-gray-400 text-lg">Detección automática de reportes en GitHub</p>
        </header>

        <div id="loading" class="flex justify-center my-10">
            <div class="loader w-12 h-12 border-4 border-gray-700 rounded-full"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="report-grid"></div>

        <footer class="mt-20 pt-8 border-t border-gray-800 text-center text-gray-500 text-sm">
            <p>© 2026 Management Dashboard | Actualizado vía GitHub API</p>
        </footer>
    </div>

    <script>
        // CONFIGURACIÓN: Cambia esto con tus datos de GitHub
        const USER = 'alfonso-fullnow';
        const REPO = 'dashboard-amazon';
    
        const monthMap = { 'Ene': 0, 'Feb': 1, 'Mar': 2, 'Abr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Ago': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dic': 11 };
    
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }
    
        async function loadReports() {
            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
                const files = await response.json();
                const reports = files.filter(file => file.name.startsWith('Dashboard') && file.name.endsWith('.html'));
    
                // Ordenar de más reciente a más antiguo
                reports.sort((a, b) => b.name.localeCompare(a.name));
    
                const grid = document.getElementById('report-grid');
                document.getElementById('loading').style.display = 'none';
    
                reports.forEach(file => {
                    let cleanName = file.name.replace('Dashboard ', '').replace('.html', '');
                    // Regex para capturar: inicio, fin y mes (ej: 29-4Ene)
                    let match = cleanName.match(/(\d+)-(\d+)([a-zA-Z]+)/);
                    
                    let weekLabel = "Semana ??";
                    let dateRange = cleanName;
                    let year = 2026;
    
                    if (match) {
                        let dayStart = match[1];
                        let dayEnd = parseInt(match[2]);
                        let monthStr = match[3];
                        let monthIndex = monthMap[monthStr] || 0;
                        
                        // Cálculo basado en la fecha final (4 de Enero, 11 de Enero, etc.)
                        let endDate = new Date(year, monthIndex, dayEnd);
                        weekLabel = "Semana " + getWeekNumber(endDate);
                        
                        // Formateo de fecha para la sublinea (ej: 29 de Dic - 04 de Ene, 2026)
                        // Para simplificar mostramos el rango original procesado
                        dateRange = `${dayStart.padStart(2, '0')} de ... - ${dayEnd.padStart(2, '0')} de ${monthStr}, ${year}`;
                    }
    
                    // Lógica simple para etiquetas (badges) basadas en el nombre
                    let badges = '';
                    if (file.name.includes('5-11Ene')) {
                        badges = `
                            <span class="text-[10px] bg-red-900/40 text-red-300 px-2 py-1 rounded font-medium mr-2">Refund Alert US</span>
                            <span class="text-[10px] bg-green-900/40 text-green-300 px-2 py-1 rounded font-medium">IT/FR Success</span>
                        `;
                    } else if (file.name.includes('29Dic-4Ene')) {
                        badges = `
                            <span class="text-[10px] bg-yellow-900/40 text-yellow-300 px-2 py-1 rounded font-medium mr-2">PPC Ranking Push</span>
                            <span class="text-[10px] bg-blue-900/40 text-blue-300 px-2 py-1 rounded font-medium">Year Transition</span>
                        `;
                    }
    
                    const card = `
                        <a href="${file.path}" class="report-card p-6 rounded-xl flex items-center justify-between group mb-4">
                            <div class="flex-1">
                                <h3 class="text-2xl font-bold text-white group-hover:text-blue-400 transition-colors">${weekLabel}</h3>
                                <p class="text-gray-400 text-sm mb-3">${dateRange}</p>
                                <div class="flex items-center">
                                    ${badges}
                                </div>
                            </div>
                            <div class="text-gray-600 group-hover:text-white transition-colors">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }
        loadReports();
    </script>
</body>
</html>
